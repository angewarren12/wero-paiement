# Blueprint Render — site statique (Vite + React)
# Déploiement : https://render.com → New → Blueprint → sélectionne ce dépôt
services:
  - type: web
    name: wero-paiement
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Rebuild automatique à chaque push sur la branche
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "18"
    # Réécriture SPA : toutes les routes renvoient index.html
    # (équivalent du _redirects Netlify, indispensable pour React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # En-têtes de sécurité de base
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
